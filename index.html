<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ark Deal Pipeline</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface-2: #1a1a24;
    --border: #2a2a3a;
    --text: #e4e4ed;
    --text-dim: #8888a0;
    --accent: #6c5ce7;
    --accent-glow: rgba(108,92,231,0.15);
    --high: #00d68f;
    --medium: #ffaa3a;
    --watch: #ff6b6b;
    --card-radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
  }
  header h1 {
    font-size: 1.75rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #a29bfe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p { color: var(--text-dim); margin-top: 0.25rem; font-size: 0.9rem; }
  header .count { color: var(--text); font-weight: 600; }

  /* Controls */
  .controls {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    justify-content: center;
    padding: 1rem 1.5rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .controls select, .controls input {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    font-size: 0.85rem;
    outline: none;
    cursor: pointer;
  }
  .controls select:focus, .controls input:focus {
    border-color: var(--accent);
  }
  .controls input {
    min-width: 200px;
    cursor: text;
  }
  .controls input::placeholder { color: var(--text-dim); }

  /* Grid */
  .grid {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 1.5rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 24px var(--accent-glow);
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 0.5rem;
  }
  .card-header .name-group { flex: 1; }
  .card-header .company { font-size: 1.2rem; font-weight: 700; }
  .card-header .tagline {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 0.15rem;
    line-height: 1.4;
    max-width: 600px;
  }

  .badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-high { background: rgba(0,214,143,0.15); color: var(--high); }
  .badge-medium { background: rgba(255,170,58,0.15); color: var(--medium); }
  .badge-watch { background: rgba(255,107,107,0.15); color: var(--watch); }
  .badge-status {
    background: var(--surface-2);
    color: var(--text-dim);
    margin-left: 0.5rem;
  }

  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.25rem;
    margin-top: 0.5rem;
    font-size: 0.82rem;
    color: var(--text-dim);
  }
  .card-meta strong { color: var(--text); font-weight: 600; }

  .card-desc {
    margin-top: 0.75rem;
    font-size: 0.88rem;
    line-height: 1.6;
    color: var(--text);
  }

  /* Sections */
  .section-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-top: 1rem;
  }
  @media (max-width: 640px) {
    .section-grid { grid-template-columns: 1fr; }
  }
  .section-box {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
  }
  .section-box h4 {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 0.4rem;
  }
  .section-box .row {
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.2rem 0;
    font-size: 0.82rem;
  }
  .section-box .row .label { color: var(--text-dim); white-space: nowrap; }
  .section-box .row .value { color: var(--text); text-align: right; }

  .why-invest {
    margin-top: 0.75rem;
    padding: 0.75rem 1rem;
    background: var(--accent-glow);
    border: 1px solid rgba(108,92,231,0.25);
    border-radius: 8px;
    font-size: 0.85rem;
    line-height: 1.5;
    color: #c8c4ff;
  }
  .why-invest strong { color: var(--accent); }

  .card-footer {
    margin-top: 0.75rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .card-footer a {
    color: var(--accent);
    text-decoration: none;
  }
  .card-footer a:hover { text-decoration: underline; }
  .card-footer .sep { color: var(--border); }

  .empty {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text-dim);
  }
  .empty h2 { font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--text); }

  .loading {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text-dim);
  }
  .loading .spinner {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>Ark Deal Pipeline</h1>
  <p><span class="count" id="totalCount">0</span> tracked startups</p>
</header>

<div class="controls">
  <select id="convictionFilter">
    <option value="all">All Conviction</option>
    <option value="High">High</option>
    <option value="Medium">Medium</option>
    <option value="Watch">Watch</option>
  </select>
  <select id="stageFilter">
    <option value="all">All Stages</option>
  </select>
  <input type="text" id="searchInput" placeholder="Search by company, founder, or tagline..." />
</div>

<div class="grid" id="grid">
  <div class="loading">
    <div class="spinner"></div>
    <p>Loading deals...</p>
  </div>
</div>

<script>
async function loadDeals() {
  try {
    const resp = await fetch('data/deals.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const deals = await resp.json();
    render(deals);
  } catch (e) {
    document.getElementById('grid').innerHTML =
      '<div class="empty"><h2>Failed to load deals</h2><p>' + e.message + '</p></div>';
  }
}

function convictionBadge(conv) {
  const cls = 'badge-' + (conv ? conv.toLowerCase() : 'watch');
  return '<span class="badge ' + cls + '">' + (conv || 'Watch') + '</span>';
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function sectionRow(label, value) {
  if (!value) return '';
  return '<div class="row"><span class="label">' + esc(label) + '</span><span class="value">' + esc(value) + '</span></div>';
}

function render(deals) {
  // Populate stage filter
  const stages = new Set();
  deals.forEach(d => { if (d.stage) stages.add(d.stage); });
  const stageSel = document.getElementById('stageFilter');
  stages.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    stageSel.appendChild(opt);
  });

  function doFilter() {
    const conv = document.getElementById('convictionFilter').value;
    const stage = document.getElementById('stageFilter').value;
    const q = document.getElementById('searchInput').value.toLowerCase();

    let filtered = deals;
    if (conv !== 'all') filtered = filtered.filter(d => d.conviction === conv);
    if (stage !== 'all') filtered = filtered.filter(d => d.stage === stage);
    if (q) {
      filtered = filtered.filter(d =>
        (d.company || '').toLowerCase().includes(q) ||
        d.founders.some(f => (f.name || '').toLowerCase().includes(q)) ||
        (d.tagline || '').toLowerCase().includes(q)
      );
    }

    document.getElementById('totalCount').textContent = filtered.length;
    const grid = document.getElementById('grid');

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty"><h2>No deals match your filters</h2><p>Try adjusting the filters above.</p></div>';
      return;
    }

    grid.innerHTML = filtered.map(d => {
      const founders = (d.founders || []).map(f => esc(f.name) + (f.role ? ' (' + esc(f.role) + ')' : '')).join(', ');
      const links = [];
      if (d.website) links.push('<a href="' + esc(d.website) + '" target="_blank" rel="noopener">Website</a>');
      if (d.linkedin) links.push('<a href="' + esc(d.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a>');

      const gi = d.generalInfo || {};
      const metrics = d.metrics || {};

      return '<div class="card">' +
        '<div class="card-header">' +
          '<div class="name-group">' +
            '<div class="company">' + esc(d.company) + convictionBadge(d.conviction) + '</div>' +
            (d.tagline ? '<div class="tagline">' + esc(d.tagline) + '</div>' : '') +
          '</div>' +
        '</div>' +
        '<div class="card-meta">' +
          (d.location ? '<span><strong>Location:</strong> ' + esc(d.location) + '</span>' : '') +
          (d.stage ? '<span><strong>Stage:</strong> ' + esc(d.stage) + '</span>' : '') +
          (d.status ? '<span><strong>Status:</strong> ' + esc(d.status) + '</span>' : '') +
          (d.source ? '<span><strong>Source:</strong> ' + esc(d.source) + '</span>' : '') +
        '</div>' +
        (d.description ? '<div class="card-desc">' + esc(d.description) + '</div>' : '') +
        '<div class="section-grid">' +
          (gi.isRaising || gi.raiseAmount || gi.raiseDetails || gi.previousInvestors ?
            '<div class="section-box"><h4>General Information</h4>' +
              sectionRow('Raising', gi.isRaising) +
              sectionRow('Amount', gi.raiseAmount) +
              sectionRow('Details', gi.raiseDetails) +
              (gi.previousInvestors ? sectionRow('Previous Investors', gi.previousInvestors.join(', ')) : '') +
            '</div>' : '') +
          (metrics.traction || metrics.revenue || metrics.lois || metrics.userGrowth || metrics.healthIndicators ?
            '<div class="section-box"><h4>Metrics</h4>' +
              sectionRow('Traction', metrics.traction) +
              sectionRow('Revenue', metrics.revenue) +
              sectionRow('LOIs', metrics.lois) +
              sectionRow('User Growth', metrics.userGrowth) +
              sectionRow('Health', metrics.healthIndicators) +
            '</div>' : '') +
        '</div>' +
        (d.whyInvest ? '<div class="why-invest"><strong>Why Invest:</strong> ' + esc(d.whyInvest) + '</div>' : '') +
        '<div class="card-footer">' +
          (founders ? '<span><strong>Founders:</strong> ' + founders + '</span>' : '') +
          (founders && links.length ? '<span class="sep">·</span>' : '') +
          (links.join(' · ')) +
          (d.firstContact ? '<span class="sep">·</span><span>First contact: ' + esc(d.firstContact) + '</span>' : '') +
          (d.nextAction ? '<span class="sep">·</span><span>' + esc(d.nextAction) + '</span>' : '') +
        '</div>' +
      '</div>';
    }).join('\n');
  }

  document.getElementById('convictionFilter').addEventListener('change', doFilter);
  document.getElementById('stageFilter').addEventListener('change', doFilter);
  document.getElementById('searchInput').addEventListener('input', doFilter);
  doFilter();
}

loadDeals();
</script>
</body>
</html>
